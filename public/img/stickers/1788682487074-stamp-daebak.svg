<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Red Circular Seal Stamp -->
  <circle cx="70" cy="70" r="62" fill="none" stroke="#FF2A6D" stroke-width="4" stroke-dasharray="8 3" />
  <circle cx="70" cy="70" r="54" fill="#FF2A6D" fill-opacity="0.15" stroke="#FF2A6D" stroke-width="2.5" />
  <!-- Stars -->
  <text x="70" y="38" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif" font-weight="900" font-size="12" fill="#FF2A6D" text-anchor="middle" letter-spacing="2">★ ★ ★</text>
  <!-- Korean Word: 대박 -->
  <text x="70" y="78" font-family="'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-weight="900" font-size="32" fill="#FF2A6D" text-anchor="middle">대박</text>
  <text x="70" y="100" font-family="monospace" font-weight="800" font-size="10" fill="#FF2A6D" text-anchor="middle" letter-spacing="1.5">AWESOME ★ 100%</text>
